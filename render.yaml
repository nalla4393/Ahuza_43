services:
  - type: web
    name: ahuza-web
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: ahuza-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_FILE
        value: /var/data/ahuza-db.json
      - key: SESSION_FILE_PATH
        value: /var/data/sessions
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SESSION_SECRET
        generateValue: true
      - key: OWNER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        value: info@ahuzawear.com
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: Ahuza Apparel <orders@ahuzawear.com>
      - key: SUPPORT_EMAIL
        value: info@ahuzawear.com
      - key: INSTAMOJO_API_KEY
        sync: false
      - key: INSTAMOJO_AUTH_TOKEN
        sync: false
      - key: INSTAMOJO_SALT
        sync: false
      - key: INSTAMOJO_REDIRECT_URL
        value: https://www.ahuzawear.com/
      - key: INSTAMOJO_WEBHOOK_URL
        value: https://www.ahuzawear.com/api/payments/instamojo/webhook
